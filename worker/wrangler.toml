# ぶにゅう の サーバー（Cloudflare Workers）の 設定（2026-11-24。本番 は 2026-11-28 公開・住所 は https://bunew.app）
# 秘密 の カギ は ここ に 書かない。`npx wrangler secret put STRIPE_SECRET` などで 入れる（worker/README.md）
name = "bunyu"
main = "src/index.js"
compatibility_date = "2026-11-01"
# 2026-11-28 代表 が 買った 住所（Cloudflare の ドメイン）。www は つけない（住所 が 2つ に なると 記録 が わかれる）
routes = [{ pattern = "bunew.app", custom_domain = true }]

# アプリ（kids-app/）も おなじ 住所 で 出す → /api/ だけ この プログラム が うける
[assets]
directory = "../kids-app"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/"]   # /admin は 代表 の 管理ページ（2026-11-26）

[[d1_databases]]
binding = "DB"
database_name = "bunyu"
database_id = "5c343532-47c8-4027-9cc6-25b82ca8097a"   # 2026-11-28 作成

[triggers]
crons = ["17 3 * * *"]

[vars]
MAIL_FROM = "ぶにゅう <no-reply@bunew.app>"   # Resend で bunew.app を 確認 して から 使える

# ---------------------------------------------------------
# 開発用（2026-11-24 代表：本番 と 開発 の 2つ）
# 公開：npx wrangler deploy --env dev → https://bunyu-dev.<名前>.workers.dev
# Stripe は テストモード の カギ、データベース は 本番 と べつ（bunyu-dev）
# 秘密 の カギ は `npx wrangler secret put STRIPE_SECRET --env dev` のように --env dev を つけて 入れる
# ---------------------------------------------------------
[env.dev]
name = "bunyu-dev"
# 2026-11-28：うえ の routes（bunew.app）は 開発用 にも 引きつがれて しまう ので、開発用 は かならず から に する
# （これ が なかった ため、開発用 を 出した とき に bunew.app が 開発用 に つながった）
routes = []
workers_dev = true

[env.dev.assets]
directory = "../kids-app"
binding = "ASSETS"
run_worker_first = true   # 開発用 は ぜんぶ の ページ に「検索 に 出さない」を つける

[[env.dev.d1_databases]]
binding = "DB"
database_name = "bunyu-dev"
database_id = "c489f972-26c3-4857-a5fe-ded91c50f4d6"

[env.dev.vars]
NOINDEX = "1"
MAIL_FROM = "ぶにゅう（開発） <onboarding@resend.dev>"   # 2026-11-26：ドメイン を 決める まで Resend の テスト用 の 差出人（Resend に 登録 した メール あて に だけ 送れる）
