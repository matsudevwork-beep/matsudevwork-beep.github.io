<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- user-scalable=no：子どもが2本指で触っても画面が拡大しないようにする -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FFF6E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="あいぼう">
  <title>あいぼうと せんかき（試作版）</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ① あいぼうをえらぶ画面 -->
    <section id="screen-select" class="screen">
      <button id="btn-select-back" class="icon-btn select-back hidden" aria-label="もどる">←</button>
      <h1 class="title"><span class="t1">あいぼうを</span> <span class="t2">えらんでね</span></h1>
      <p class="sub">まるくて ぽにょっと いっしょに そだとう！</p>
      <div id="select-list" class="select-list"></div>
      <p class="note">※ しさくばん です</p>
    </section>

    <!-- ② ホーム（あいぼうのお世話） -->
    <section id="screen-home" class="screen">
      <header class="topbar">
        <div class="stage-box">
          <span id="stage-label" class="stage-label">1</span>
          <div class="gauge"><div id="gauge-fill" class="gauge-fill"></div></div>
        </div>
        <button id="btn-change" class="icon-btn" aria-label="あいぼうを かえる" data-icon="change"></button>
        <button id="btn-zukan" class="icon-btn" aria-label="ずかん" data-icon="book"></button>
        <button id="btn-sound" class="icon-btn" aria-label="おと"></button>
      </header>

      <div id="pet-area" class="pet-area">
        <div class="ground"></div>
        <div id="bubble" class="bubble"></div>
        <div id="pet" class="pet"></div>
        <div id="effects" class="effects"></div>
      </div>

      <div class="play-row">
        <button class="play-btn" data-play="ball"><span class="play-icon" data-icon="ball"></span>ボール</button>
        <button class="play-btn" data-play="bath"><span class="play-icon" data-icon="bubble"></span>おふろ</button>
        <button class="play-btn" data-play="dance"><span class="play-icon" data-icon="note"></span>ダンス</button>
        <button class="play-btn" data-play="talk"><span class="play-icon" data-icon="talk"></span>おはなし</button>
      </div>

      <div class="tray">
        <div class="tray-item" data-item="water">
          <div class="tray-icon" id="icon-water"></div>
          <span class="tray-count" id="count-water">0</span>
        </div>
        <div class="tray-item" data-item="food">
          <div class="tray-icon" id="icon-food"></div>
          <span class="tray-count" id="count-food">0</span>
        </div>
        <button id="btn-study" class="big-btn">べんきょう</button>
      </div>
      <div id="drag-hint" class="drag-hint hidden">👆 ひっぱって あげてね</div>

      <!-- おはなし：こたえを えらぶ -->
      <div id="talk-panel" class="talk-panel hidden">
        <div id="talk-choices" class="talk-choices"></div>
        <button id="talk-close" class="talk-close" aria-label="とじる">✕</button>
      </div>
    </section>

    <!-- ③ せんかき（運筆）画面 -->
    <section id="screen-trace" class="screen">
      <header class="topbar">
        <button id="btn-back" class="icon-btn" aria-label="もどる">←</button>
        <span id="level-label" class="level-label"></span>
        <div id="mini-pet" class="mini-pet"></div>
      </header>
      <div id="trace-bubble" class="bubble trace-bubble"></div>
      <svg id="trace-svg" class="trace-svg" viewBox="0 0 360 480"></svg>
      <div class="trace-tools">
        <button id="btn-erase" class="sub-btn erase-btn"><span class="btn-icon" data-icon="eraser"></span>けして やりなおす</button>
      </div>
    </section>

    <!-- ③-3 いっしょに よもう（ひらがなを 1もじずつ さわって よむ） -->
    <section id="screen-read" class="screen">
      <header class="topbar">
        <button id="btn-read-back" class="icon-btn" aria-label="もどる">←</button>
        <span id="read-label" class="level-label"></span>
        <div id="read-pet" class="mini-pet"></div>
      </header>
      <div id="read-bubble" class="bubble trace-bubble"></div>
      <div class="read-stage">
        <div id="read-pic" class="read-pic"></div>
        <div id="read-tiles" class="read-tiles"></div>
      </div>
      <div class="trace-tools">
        <button id="btn-read-along" class="sub-btn erase-btn"><span class="btn-icon" data-icon="soundOn"></span>いっしょに よんで</button>
      </div>
    </section>

    <!-- ③-4 ものがたり（じょうきゅう・たてがき） -->
    <section id="screen-story" class="screen">
      <header class="topbar">
        <button id="btn-story-back" class="icon-btn" aria-label="もどる">←</button>
        <span id="story-label" class="level-label story-label"></span>
        <div id="story-pet" class="mini-pet"></div>
      </header>
      <div id="story-bubble" class="bubble trace-bubble"></div>
      <div class="story-page">
        <div id="story-text" class="story-text"></div>
        <div id="story-pic" class="story-pic"></div>
      </div>
      <div class="story-tools">
        <button id="btn-story-along" class="sub-btn erase-btn"><span class="btn-icon" data-icon="soundOn"></span>おてほん</button>
        <button id="btn-story-next" class="big-btn hidden">つぎの ページ ▶</button>
      </div>
    </section>

    <!-- ③-5 ためしの あそび（めいろ・かず・みちつなぎ・とけい）共通の画面 -->
    <section id="screen-game" class="screen">
      <header class="topbar">
        <button id="btn-game-back" class="icon-btn" aria-label="もどる">←</button>
        <span id="game-label" class="level-label"></span>
        <div id="game-pet" class="mini-pet"></div>
      </header>
      <div id="game-bubble" class="bubble trace-bubble"></div>
      <div id="game-area" class="game-area"></div>
      <div id="game-tools" class="trace-tools"></div>
    </section>

    <!-- ③-2 べんきょうを えらぶ -->
    <section id="screen-study" class="screen">
      <header class="topbar">
        <button id="btn-study-back" class="icon-btn" aria-label="もどる">←</button>
        <span class="level-label">なにを する？</span>
        <span class="topbar-spacer"></span>
      </header>
      <div class="study-list">
        <!-- きょうの おけいこ（その子に あわせた くみあわせ） -->
        <button id="study-course" class="course-card">
          <span class="course-title">きょうの おけいこ</span>
          <span id="course-steps" class="course-steps"></span>
          <span id="course-sub" class="course-sub"></span>
        </button>
        <p class="study-head">すきな もの を やる</p>
        <div id="study-base" class="study-group"></div>
        <p class="study-head">ためしに やってみる（しさく）</p>
        <div id="study-trial" class="study-group"></div>
      </div>
    </section>

    <!-- ④ しんか ずかん -->
    <section id="screen-zukan" class="screen">
      <header class="topbar">
        <button id="btn-zukan-back" class="icon-btn" aria-label="もどる">←</button>
        <span id="zukan-title" class="level-label"></span>
        <span class="topbar-spacer"></span>
      </header>
      <p id="zukan-catch" class="sub"></p>
      <div id="zukan-grid" class="zukan-grid"></div>
    </section>

    <!-- ⑤ ごほうび・成長などのお知らせ -->
    <div id="modal" class="modal hidden">
      <div class="modal-card">
        <div id="modal-art" class="modal-art"></div>
        <p id="modal-text" class="modal-text"></p>
        <button id="modal-btn" class="big-btn"></button>
        <button id="modal-btn2" class="sub-btn modal-btn2 hidden"></button>
      </div>
    </div>

    <!-- 保護者メニュー（歯車を2秒長押し） -->
    <div id="parent-menu" class="modal hidden">
      <div class="modal-card parent-card">
        <p class="parent-title">保護者メニュー</p>
        <p id="parent-info" class="parent-info"></p>
        <button id="parent-reward" class="sub-btn">きょうの ごほうび回数を もどす</button>
        <button id="parent-wipe" class="sub-btn danger">データを すべて消す</button>
        <button id="parent-close" class="big-btn">とじる</button>
        <p class="parent-credit">ひらがなの書き順データ：<a href="https://kanjivg.tagaini.net/" target="_blank" rel="noopener">KanjiVG</a>（© Ulrich Apel）をアプリ用に加工して使用しています。ライセンス：<a href="https://creativecommons.org/licenses/by-sa/3.0/deed.ja" target="_blank" rel="noopener">CC BY-SA 3.0</a>（加工したデータ hiragana.js も同じライセンスで公開）</p>
      </div>
    </div>

    <!-- 保護者向け：長押しでメニュー -->
    <button id="btn-reset" class="reset-btn" aria-label="保護者メニュー">⚙︎</button>
  </div>

  <script src="characters.js"></script>
  <script src="levels.js"></script>
  <script src="hiragana.js"></script>
  <script src="katakana.js"></script>
  <script src="app.js"></script>
  <script src="games.js"></script>
</body>
</html>
